<div class="page-header">
  <div>
    <h1>Teachers</h1>
    <p class="page-subtitle">Teachers at your school.</p>
  </div>
  <a mat-flat-button color="primary" routerLink="/principal/teachers/new">
    <mat-icon>add</mat-icon>
    New teacher
  </a>
</div>

<div class="surface-card">
  @if (loading()) {
    <div class="loading-row">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else if (teachers().length === 0) {
    <p class="empty-state">No teachers at this school yet.</p>
  } @else {
    <table mat-table [dataSource]="teachers()" class="teacher-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let teacher">{{ teacher.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let teacher">{{ teacher.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let teacher">{{ teacher.email }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let teacher" class="actions-cell">
        <a
          mat-icon-button
          [routerLink]="['/principal/teachers', teacher.id, 'students']"
          aria-label="Manage students"
        >
          <mat-icon>group</mat-icon>
        </a>
        <a
          mat-icon-button
          [routerLink]="['/principal/teachers', teacher.id, 'edit']"
          aria-label="Edit"
        >
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="deleteTeacher(teacher)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPageChange($event)"
  ></mat-paginator>
  }
</div>
