<div class="page-header">
  <div>
    <h1>Students</h1>
    <p class="page-subtitle">Students at your school.</p>
  </div>
  <a mat-flat-button color="primary" routerLink="/principal/students/new">
    <mat-icon>add</mat-icon>
    New student
  </a>
</div>

<div class="surface-card">
  @if (loading()) {
    <div class="loading-row">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else if (students().length === 0) {
    <p class="empty-state">No students at this school yet.</p>
  } @else {
    <table mat-table [dataSource]="students()" class="student-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let student">{{ student.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let student">{{ student.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let student">{{ student.email }}</td>
    </ng-container>

    <ng-container matColumnDef="dateOfBirth">
      <th mat-header-cell *matHeaderCellDef>Date of birth</th>
      <td mat-cell *matCellDef="let student">{{ student.dateOfBirth }}</td>
    </ng-container>

    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef>Age</th>
      <td mat-cell *matCellDef="let student">{{ student.age }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let student" class="actions-cell">
        <a
          mat-icon-button
          [routerLink]="['/principal/students', student.id, 'teachers']"
          aria-label="Manage teachers"
        >
          <mat-icon>group</mat-icon>
        </a>
        <a
          mat-icon-button
          [routerLink]="['/principal/students', student.id, 'edit']"
          aria-label="Edit"
        >
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="deleteStudent(student)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPageChange($event)"
  ></mat-paginator>
  }
</div>
