<div class="list-header">
  <h1>Schools</h1>
  <a mat-flat-button color="primary" routerLink="/schools/new">
    <mat-icon>add</mat-icon>
    New school
  </a>
</div>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Filter by name</mat-label>
  <input matInput [formControl]="nameFilter" placeholder="e.g. Ankara" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (loading()) {
  <div class="loading-row">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else if (schools().length === 0) {
  <p class="empty-state">No schools found.</p>
} @else {
  <table mat-table [dataSource]="schools()" class="school-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let school">{{ school.id }}</td>
    </ng-container>

    <ng-container matColumnDef="schoolName">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let school">{{ school.schoolName }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Address</th>
      <td mat-cell *matCellDef="let school">{{ school.address }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let school" class="actions-cell">
        <a mat-icon-button [routerLink]="['/schools', school.id, 'edit']" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="deleteSchool(school)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPageChange($event)"
  ></mat-paginator>
}
