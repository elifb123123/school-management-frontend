<div class="picker-page">
  <div class="picker-shell">
    <span class="brand-mark">
      <mat-icon>school</mat-icon>
    </span>
    <h1>Select your school</h1>
    <p class="subtitle">Which school are you the principal of?</p>

    <div class="surface-card list-card">
      @if (loading()) {
        <div class="loading-row">
          <mat-spinner diameter="32"></mat-spinner>
        </div>
      } @else if (schools().length === 0) {
        <p class="empty-state">No schools available.</p>
      } @else {
        <div class="results-list">
          @for (school of schools(); track school.id) {
            <button type="button" class="result-row" (click)="selectSchool(school)">
              <span class="avatar">{{ school.schoolName.charAt(0) }}</span>
              <span class="result-info">
                <span class="result-name">{{ school.schoolName }}</span>
                <span class="result-address">{{ school.address }}</span>
              </span>
              <mat-icon class="chevron">chevron_right</mat-icon>
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
