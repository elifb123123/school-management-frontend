<div class="picker-page">
  <div class="picker-shell">
    <span class="brand-mark">
      <mat-icon>school</mat-icon>
    </span>
    <h1>School Management</h1>
    <p class="subtitle">Sign in with your account to continue.</p>

    <div class="role-grid">
      <a routerLink="/login" class="role-card">
        <span class="role-icon"><mat-icon>login</mat-icon></span>
        <span class="role-title">Sign in</span>
        <span class="role-desc">Principals, teachers, and students all sign in here</span>
      </a>
      <a routerLink="/register/principal" class="role-card">
        <span class="role-icon"><mat-icon>admin_panel_settings</mat-icon></span>
        <span class="role-title">Register your school</span>
        <span class="role-desc">New principal? Create your account and school</span>
      </a>
    </div>
  </div>
</div>
