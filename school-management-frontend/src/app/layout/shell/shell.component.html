@if (showChrome() && session(); as s) {
  <mat-toolbar class="app-toolbar">
    <div class="brand">
      <span class="brand-mark">
        <mat-icon>school</mat-icon>
      </span>
      <span class="brand-name">School Management</span>
    </div>
    <span class="spacer"></span>
    <a
      class="user-chip"
      [routerLink]="profileRoute()"
      routerLinkActive="user-chip--active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="View my profile"
    >
      <span class="user-avatar">{{ s.label.charAt(0) }}</span>
      <span class="user-info">
        <span class="user-name">{{ s.label }}</span>
        <span class="user-role">{{ s.role }}</span>
      </span>
    </a>
    <button mat-icon-button (click)="switchRole()" aria-label="Switch role">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  @if (navItems().length > 0) {
    <mat-sidenav-container class="shell-container">
      <mat-sidenav mode="side" opened class="shell-sidenav">
        <mat-nav-list>
          @for (item of navItems(); track item.path) {
            <a
              mat-list-item
              class="nav-link"
              [routerLink]="item.path"
              routerLinkActive="active-link"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      </mat-sidenav>

      <mat-sidenav-content class="shell-content">
        <div class="shell-content-inner">
          <router-outlet></router-outlet>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  } @else {
    <div class="shell-content shell-content--full">
      <div class="shell-content-inner">
        <router-outlet></router-outlet>
      </div>
    </div>
  }
} @else {
  <router-outlet></router-outlet>
}
